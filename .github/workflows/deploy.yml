name: Deploy to GitHub Pages

# Builds the static export and publishes it. There is no server anywhere in
# this pipeline — the artefact is plain files (docs/02_TECH_SPEC.md C1).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. A queued run supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Deliberately before the build, not after.
      #
      # This step is the one that fails when the repository's Pages source is not
      # set to "GitHub Actions" — the default is "Deploy from a branch", under
      # which GitHub publishes the branch with Jekyll and this workflow can never
      # deploy at all. Running it first turns that misconfiguration into a
      # five-second failure instead of one at the end of a full build.
      #
      # If it fails here, the fix is in repository settings, not in this file:
      # Settings -> Pages -> Build and deployment -> Source -> GitHub Actions.
      - uses: actions/configure-pages@v5

      # `npm run build` is the single entry point. It runs the asset build via
      # the prebuild hook — see docs/02_TECH_SPEC.md §4.
      - name: Build static export
        run: npm run build
        env:
          # Required: Pages serves project sites from /<repo>/, not the root.
          # See the comment in next.config.ts. Remove this when moving to a
          # custom domain.
          NEXT_PUBLIC_BASE_PATH: /mdaas

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
